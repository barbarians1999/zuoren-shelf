<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1efe7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="左人书架">
  <meta name="description" content="个人在线阅读书架">
  <title>左人书架</title>
  <script>try { const theme = JSON.parse(localStorage.getItem('reading-desk:theme:v1')); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v=author-emphasis-20261102">
</head>
<body>
  <header class="topbar">
    <div class="shelf-tools">
      <label for="book-search">找一本书</label>
      <input id="book-search" type="search" placeholder="书名或作者" autocomplete="off" enterkeyhint="search">
      <span id="shelf-count" class="shelf-count" role="status" aria-live="polite"></span>
    </div>
    <nav id="category-filters" class="category-filters" aria-label="按分类筛选书籍" hidden></nav>
  </header>
  <main class="shell">
    <h1 class="visually-hidden">左人书架</h1>
    <section id="shelf" class="shelf" aria-label="书架">
      <section id="author-index" class="author-index" aria-labelledby="author-index-title" hidden>
        <h2 id="author-index-title" class="visually-hidden">经典作家</h2>
        <nav class="author-choices" aria-label="经典作家入口">
          <a class="author-card" href="?author=marx" data-author-link="marx"><span class="author-portrait portrait-marx" aria-hidden="true"></span><span class="author-name">马克思</span></a>
          <a class="author-card" href="?author=engels" data-author-link="engels"><span class="author-portrait portrait-engels" aria-hidden="true"></span><span class="author-name">恩格斯</span></a>
          <a class="author-card" href="?author=lenin" data-author-link="lenin"><span class="author-portrait portrait-lenin" aria-hidden="true"></span><span class="author-name">列宁</span></a>
          <a class="author-card" href="?author=stalin" data-author-link="stalin"><span class="author-portrait portrait-stalin" aria-hidden="true"></span><span class="author-name">斯大林</span></a>
          <a class="author-card" href="?author=mao" data-author-link="mao"><span class="author-portrait portrait-mao" aria-hidden="true"></span><span class="author-name">毛泽东</span></a>
        </nav>
      </section>
      <section id="author-view" class="author-view is-hidden" aria-labelledby="author-title">
        <header class="author-view-head">
          <a id="author-back" class="author-back" href="./">← 返回书架</a>
          <div class="author-profile">
            <span id="author-profile-portrait" class="author-portrait author-profile-portrait" aria-hidden="true"></span>
            <div class="author-profile-copy">
              <h2 id="author-title"></h2>
              <p id="author-bio" class="author-bio"></p>
              <p id="author-summary" class="visually-hidden"></p>
            </div>
          </div>
          <button id="author-clear-filters" class="text-button is-hidden" type="button">清除搜索</button>
        </header>
        <section id="author-featured-group" class="author-group" aria-labelledby="author-featured-title">
          <h3 id="author-featured-title" class="visually-hidden">作品与文章 · 按时间排列 <span id="author-featured-count"></span></h3>
          <ol id="author-featured-list" class="author-featured-list"></ol>
          <p id="author-featured-empty" class="author-view-empty is-hidden" role="status"></p>
        </section>
        <section id="author-references-group" class="author-group is-hidden" aria-labelledby="author-references-title">
          <h3 id="author-references-title">相关书目 <span id="author-references-count"></span></h3>
          <div id="author-references" class="book-grid"></div>
          <p id="author-references-empty" class="author-view-empty is-hidden" role="status"></p>
        </section>
      </section>
      <div id="book-list" class="book-grid">
        <div class="loading-card">正在打开书架……</div>
      </div>
    </section>
    <section id="reader" class="reader is-hidden" aria-label="阅读器">
      <div id="desktop-reader" class="desktop-reader">
        <div class="reader-head">
          <button id="back-button" class="text-button" type="button">← 返回书架</button>
          <div class="reader-head-actions"><span id="section-count" class="muted"></span><details class="settings desktop-reading-settings"><summary class="text-button">阅读设置</summary><div class="settings-menu" role="group" aria-label="阅读排版设置">
              <fieldset class="setting-group"><legend>外观</legend><div class="setting-options" role="group" aria-label="外观模式"><button type="button" data-theme-choice="system" aria-pressed="true">跟随系统</button><button type="button" data-theme-choice="light" aria-pressed="false">日间</button><button type="button" data-theme-choice="dark" aria-pressed="false">夜间</button></div></fieldset>
              <fieldset class="setting-group"><legend>字号</legend><div class="setting-options" role="group" aria-label="正文字号"><button type="button" data-size="small" aria-pressed="false">小</button><button type="button" data-size="medium" aria-pressed="true">中</button><button type="button" data-size="large" aria-pressed="false">大</button></div></fieldset>
              <fieldset class="setting-group"><legend>行距</legend><div class="setting-options" role="group" aria-label="正文行距"><button type="button" data-spacing="tight" aria-pressed="false">紧凑</button><button type="button" data-spacing="normal" aria-pressed="true">默认</button><button type="button" data-spacing="wide" aria-pressed="false">宽松</button></div></fieldset>
              <fieldset class="setting-group"><legend>字体</legend><div class="setting-options font-options" role="group" aria-label="正文字体"><button type="button" data-reading-font="system" aria-pressed="true">系统</button><button type="button" data-reading-font="source-han" aria-pressed="false">思源宋体</button><button type="button" data-reading-font="fangsong" aria-pressed="false">字体管家仿宋</button><button type="button" data-reading-font="hanyi-shufang" aria-pressed="false">汉仪书仿55W</button></div></fieldset>
              <p class="font-load-status" role="status" aria-live="polite"></p>
            </div></details><button id="desktop-toc-toggle-button" class="text-button desktop-only" type="button" aria-expanded="true" aria-controls="desktop-toc-panel">收起目录</button></div>
        </div>
        <div class="reader-grid">
          <aside id="desktop-toc-panel" class="toc-panel">
            <div class="toc-head"><p class="contents-label eyebrow">目录</p></div>
            <nav id="desktop-toc" aria-label="章节目录"></nav>
            <p id="desktop-scan-summary" class="scan-summary is-hidden"></p>
          </aside>
          <article id="desktop-reading-panel" class="reading-panel">
            <div class="reading-meta"><span id="book-title"></span><span id="book-author"></span><div class="reading-actions"><span id="reading-position"></span></div></div>
            <h2 id="section-title"></h2>
            <div id="desktop-content" class="content" tabindex="-1"></div>
            <div class="reader-nav">
              <button id="prev-button" class="nav-button" type="button">上一节</button>
              <button id="next-button" class="nav-button primary" type="button">下一节</button>
            </div>
          </article>
        </div>
      </div>

      <section id="mobile-reader" class="mobile-reader" hidden aria-label="手机阅读器">
        <header class="mobile-reader-head">
          <button id="mobile-back-button" class="text-button" type="button">← 返回书架</button>
          <div class="mobile-reader-title"><strong id="mobile-book-title"></strong><span id="mobile-reading-position" class="muted"></span></div>
          <div class="reader-head-actions"><details class="settings mobile-font-settings"><summary class="text-button">设置</summary><div class="settings-menu" role="group" aria-label="阅读排版设置">
            <fieldset class="setting-group"><legend>外观</legend><div class="setting-options" role="group" aria-label="外观模式"><button type="button" data-theme-choice="system" aria-pressed="true">跟随系统</button><button type="button" data-theme-choice="light" aria-pressed="false">日间</button><button type="button" data-theme-choice="dark" aria-pressed="false">夜间</button></div></fieldset>
            <fieldset class="setting-group"><legend>字号</legend><div class="setting-options" role="group" aria-label="正文字号"><button type="button" data-size="small" aria-pressed="false">小</button><button type="button" data-size="medium" aria-pressed="true">中</button><button type="button" data-size="large" aria-pressed="false">大</button></div></fieldset>
            <fieldset class="setting-group"><legend>行距</legend><div class="setting-options" role="group" aria-label="正文行距"><button type="button" data-spacing="tight" aria-pressed="false">紧凑</button><button type="button" data-spacing="normal" aria-pressed="true">默认</button><button type="button" data-spacing="wide" aria-pressed="false">宽松</button></div></fieldset>
            <fieldset class="setting-group"><legend>字体</legend><div class="setting-options font-options" role="group" aria-label="正文字体"><button type="button" data-reading-font="system" aria-pressed="true">系统</button><button type="button" data-reading-font="source-han" aria-pressed="false">思源宋体</button><button type="button" data-reading-font="fangsong" aria-pressed="false">字体管家仿宋</button><button type="button" data-reading-font="hanyi-shufang" aria-pressed="false">汉仪书仿55W</button></div></fieldset>
            <p class="font-load-status" role="status" aria-live="polite"></p>
          </div></details><button id="mobile-toc-toggle-button" class="text-button" type="button" aria-expanded="false" aria-controls="mobile-toc-panel">目录</button></div>
        </header>
        <div id="mobile-reading-viewport" class="mobile-reading-viewport" tabindex="-1">
          <article class="mobile-reading-panel">
            <h2 id="mobile-section-title"></h2>
            <div id="mobile-content" class="content" tabindex="-1"></div>
          </article>
        </div>
        <div id="mobile-toc-backdrop" class="toc-backdrop" aria-hidden="true"></div>
        <div id="mobile-toc-panel" class="mobile-toc-panel" role="dialog" aria-label="手机目录" aria-hidden="true" inert>
          <div class="toc-head"><p class="contents-label eyebrow">目录</p><button id="mobile-toc-close-button" class="text-button" type="button">完成</button></div>
          <nav id="mobile-toc" aria-label="章节目录"></nav>
          <p id="mobile-scan-summary" class="scan-summary is-hidden"></p>
        </div>
      </section>
    </section>
  </main>
  <p id="progress-notice" class="progress-notice" role="status" hidden>浏览器未允许保存阅读进度；仍可正常阅读。</p>
  <footer>友情链接：<a href="https://barbarians1999.github.io/sheke-shelf/" target="_blank" rel="noopener noreferrer">社科书架 GitHub Pages</a></footer>
  <script src="reader-notes.js?v=imperialism-math-20261101" defer></script>
  <script src="app.js?v=author-emphasis-20261102" defer></script>
</body>
</html>
