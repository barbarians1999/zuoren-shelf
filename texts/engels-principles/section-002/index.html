    <article class="content seo-content"><b>　　第二个问题：什么是无产阶级？</b><br><br>
　　<b>答：</b>无产阶级是完全靠出卖自己的劳动而不是靠某一种资本的利润来获得生活资料的社会阶级。这一阶级的祸福、存亡和整个生存，都取决于对劳动的需求，即取决于生意的好坏，取决于不受限制的竞争的波动。一句话，无产阶级或无产者阶级是19世纪的劳动阶级。<br>
<br></article>
