    <article class="content seo-content"><b>　　第三个问题：是不是说，无产者不是一向就有的？</b><br><br>
　　<b>答：</b>是的，不是一向就有的。穷人和劳动阶级一向就有；并且劳动阶级通常都是贫穷的。但是，生活在上述条件下的这种穷人、这种工人，即无产者，并不是一向就有的，正如竞争并不一向是自由和不受限制的一样。<br>
