    <article class="content seo-content"><div><h2>第五部</h2><p>复　查</p><p>人民群众自己的解放，只有人民群众自己起来斗争，自己起来争取，才能获得，才能保持与巩固；而不是任何群众之外的人所能恩赐、所能给予的，也不是任何群众之外的人能够代替群众去争取的。所以恩赐的观点，代替群众斗争的观点，是错误的。</p><p>——刘少奇</p></div></article>
