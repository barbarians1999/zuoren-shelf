    <article class="content seo-content"><div><h3>第七部</h3><p>解疙瘩</p><p>胜利是属于被剥削者的，因为生活是属于他们的，数量的优势，群众的力量是属于他们的，一切奋不顾身的、有思想的、诚实的、勇往直前的、正在觉醒过来建设新事物的、蕴藏着无穷的精力和天才的所谓“老百姓”，即工人和农民的那种取之不尽的力量是属于他们的。胜利一定是他们的。</p><p>——列宁</p></div></article>
