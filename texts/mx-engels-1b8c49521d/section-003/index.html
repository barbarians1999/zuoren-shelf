    <article class="content seo-content"><h2>第三章　区部</h2><br>
　　<b>第十二条</b>　区部辖有两个以上十个以下支部。<br>
　　<b>第十三条</b>　由这些支部的主席和副主席组成区部委员会。区部委员会从委员中选出领导人。区部委员会同本区各支部和总区部保持联系。<br>
　　<b>第十四条</b>　区部委员会是区内各支部的权力执行机关。<br>
　　<b>第十五条</b>　各独立支部须加入已有的区部，或同其他各别的支部成立新的区部。<br>
