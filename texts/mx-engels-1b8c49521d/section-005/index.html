    <article class="content seo-content"><h2>第五章　中央委员会</h2><br>
　　<b>第二十一条</b>　中央委员会是全盟的权力执行机关，向代表大会报告工作。<br>
　　<b>第二十二条</b>　中央委员会的成员不少于五人，由代表大会指定为中央委员会所在地区的区部委员会选出。<br>
　　<b>第二十三条</b>　中央委员会同各总区部保持联系，每三个月作一次关于全盟状况的报告。<br>
