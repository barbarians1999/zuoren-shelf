<b>007）</b>


<br>
<br>
　　我觉得我们要有人到外国去，看些新东西，学些新道理，研究有用的学问拿回来，改造我们的国家。同时也要有人留在本国，研究本国问题。我觉得我对于自己的国家我所知道的还太少，假若我把时间花费在本国，则对本国更为有利。<br><br>

</article>
