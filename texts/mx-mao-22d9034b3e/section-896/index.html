<b>276)</b>


<br>
<br>
　　许多外地学生，几次冲入中南海，一些军事院校冲进国防部，中央和军委并没有指责他们，更没有让他们认罪，悔过，或者写检讨，讲清楚，让他们回去就行了，而各地把冲军事机关一事，却看得太重了。<br><br>
