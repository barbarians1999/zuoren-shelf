<b>345)</b>


<br>
<br>
　　公安机关是无产阶级手里的一把刀子，掌握得好，就能打击敌人，保卫人民；掌握不好，就容易伤害自己。这把刀子要是被坏人抓走了，那就更加危险。所以，公安工作只能由党委直接领导，不能由业务部门垂直领导。<br><br>

</article>
